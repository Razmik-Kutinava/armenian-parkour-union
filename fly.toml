app = "armenian-parkour-union"
primary_region = "fra"

[build]

[deploy]
  # scripts/migrate.js: drizzle-orm migrator, skips when drizzle/ has no migrations yet.
  release_command = "node scripts/migrate.js"

[env]
  PORT = "3000"
  PROTOCOL_HEADER = "x-forwarded-proto"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
