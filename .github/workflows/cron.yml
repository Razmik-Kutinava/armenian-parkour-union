# Ежечасная сверка платежей (docs/07, раздел 7): будит спящую машину Fly и вызывает POST /api/cron/payments.
# Пока машина не спит, сверку раз в 5 минут делает таймер в приложении (startReconcileTimer).
# Токен — CRON_SECRET, одно значение в GitHub Secrets и в Fly secrets. Нет секрета — шаг пропускается.
name: Cron

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-payments
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    name: Reconcile payments
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: https://parkour.am
    steps:
      - name: POST /api/cron/payments
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set, skipped"; exit 0; fi
          # Машина просыпается несколько секунд: повторы покрывают первый отказ.
          # JSON обязателен: POST без него SvelteKit считает формой с чужого сайта (403).
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' "$SITE_URL/api/cron/payments"
