# Плановые вызовы приложения (будят спящую машину Fly):
# - ежечасно — сверка платежей (docs/07, раздел 7): POST /api/cron/payments. Пока машина не спит,
#   сверку раз в 5 минут делает таймер в приложении (startReconcileTimer);
# - раз в сутки в 09:00 по Еревану — членства (docs/03, раздел 2 п. 4): POST /api/cron/memberships;
#   сертификаты тренеров и судей (docs/03, разделы 4.6, 5.3): POST /api/cron/certificates;
#   брошенные попытки теста портала (docs/03, раздел 18.3 п. 4): POST /api/cron/training.
# Ручной запуск — все задачи. Токен — CRON_SECRET, одно значение в GitHub Secrets и в Fly secrets.
# Нет секрета — шаг пропускается.
name: Cron

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: false

permissions: {}

env:
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  SITE_URL: https://parkour.am

jobs:
  reconcile:
    name: Reconcile payments
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' && github.event.schedule != '0 5 * * *'
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/payments
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set, skipped"; exit 0; fi
          # Машина просыпается несколько секунд: повторы покрывают первый отказ.
          # JSON обязателен: POST без него SvelteKit считает формой с чужого сайта (403).
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' "$SITE_URL/api/cron/payments"

  memberships:
    name: Daily memberships
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' && github.event.schedule != '17 * * * *'
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/memberships
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set, skipped"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' "$SITE_URL/api/cron/memberships"

  certificates:
    name: Daily certificates
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' && github.event.schedule != '17 * * * *'
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/certificates
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set, skipped"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' "$SITE_URL/api/cron/certificates"

  training:
    name: Daily training quiz
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' && github.event.schedule != '17 * * * *'
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/training
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set, skipped"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' "$SITE_URL/api/cron/training"
