name: Semgrep

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Находки дают non-zero exit; SARIF всё равно грузится в Code scanning.
      - name: Semgrep scan (SARIF)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --sarif \
            --output=semgrep.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
