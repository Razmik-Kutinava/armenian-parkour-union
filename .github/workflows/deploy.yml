# Деплой только вручную (Actions → Deploy → Run workflow) — по апруву владельца.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # SENTRY_AUTH_TOKEN is optional: without it the build skips the source map upload.
      - run: |
          args=(--remote-only --build-arg "SENTRY_RELEASE=$GITHUB_SHA")
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            args+=(--build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN")
          fi
          flyctl deploy "${args[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
